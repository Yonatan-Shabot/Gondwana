{{- define "gondwana.global.rbac" }}
{{- range $values := .Values.commons.rbac }}
{{- $roleName := .name }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "gondwana.labels" $ | indent 4 }}
rules:
{{ toYaml .rules | indent 2 }}
---
{{- range .bindTo }}
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $roleName }}-{{ . }}
  labels:
    {{- include "gondwana.labels" $ | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
---
{{- end }}
{{- end }}
{{- end }}