{{- range $context := .Values.services.jobs }}

{{- $files := include "universal.files.getList" (dict "files" $context.files "filesFrom" $context.filesFrom "name" $context.name "root" $) | fromYamlArray }}

{{- if $context.cron }}
{{- include "universal.skeleton.cronJob" (dict "context" $context "ports" $context.ports "volumes" $context.pvc "files" $files "env" $context.env "root" $) }}
{{- else }}
{{- include "universal.skeleton.cronJob" (dict "context" $context "ports" $context.ports "volumes" $context.pvc "files" $files "env" $context.env "root" $) }}
{{- end }}
---
{{- end }}
