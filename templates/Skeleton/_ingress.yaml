{{- define "gondwana.skeleton.ingress" }}
{{- /* This skeleton expects the following arguments inside the dict */}}
{{ $root := .root }} {{- /* Should be $
.parentName - the name of the service this manifest is a part of
.exposedPort - The port configuration this ingress is exposing
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .parentName }}-{{ .exposedPort.name }}{{- include "gondwana.nameSuffix" $root}}
  labels:
    microservice/name: {{ .parentName | quote }}
    {{- include "gondwana.labels" $root | indent 4 }}
spec:
  rules:
    - host: {{ index (splitList "/" .exposedPort.ingress.url ) 0 }} 
      http:
        paths:
        - path: {{ regexReplaceAll "^.*?/" (.exposedPort.ingress.url ) "/" }} 
          pathType: Prefix
          backend:
            service:
              name: {{ .parentName }}
              port:
                number: {{ .exposedPort.port }}
---
{{- end }}